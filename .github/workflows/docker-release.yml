name: Build & Push Docker Image to GHCR
on:
  push:
    branches:
      - v4
  workflow_dispatch: # 支持网页手动触发
permissions:
  contents: write
  packages: write # 推送 GHCR 镜像必须
env:
  REGISTRY: ghcr.io
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true # 新提交取消旧构建任务
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24 (read package.json version)
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Normalize repository name to lowercase (GHCR requirement)
        id: image-name
        run: |
          set -euo pipefail
          IMG=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMG}" >> "$GITHUB_OUTPUT"
      - name: Read package.json version
        id: pkg-version
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Current package version: ${VER}"
      - name: Check if GHCR image tag already exists
        id: check-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}"
          TAG="${{ steps.pkg-version.outputs.version }}"
          echo "Checking image: ${IMAGE}:${TAG}"
          set +e
          # 修复：改用repo路径查询，个人仓库稳定
          gh api --method GET /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/packages/container/${{ steps.image-name.outputs.name#*/ }}/versions --jq ".[] | select( any(.metadata.container.tags[]; . == \"${TAG}\") )" >/dev/null 2>&1
          RET=$?
          set -e
          if [ ${RET} -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Image tag ${TAG} already exists, skip build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "❌ Image tag ${TAG} not found, proceed build"
          fi
      - name: Skip build if image already exists
        if: steps.check-image.outputs.exists == 'true'
        run: echo "Image already present, nothing to do." && exit 0
      - name: Calculate all docker tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}"
          VER="${{ steps.pkg-version.outputs.version }}"
          MAJOR="${VER%%.*}"
          # 固定版本标签 + major标签
          TAGS="${IMAGE}:${VER}"$'\n'"${IMAGE}:${MAJOR}"
          # v4分支增加 latest
          TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          { echo "list<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "Generated tags:"
          echo "${TAGS}"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ shturl.cc/pQ }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU (multi arch)
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
